name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # Se corre ANTES que nada: si se filtró una credencial, no queremos ni
  # compilar, queremos que el PR falle a la vista.
  secretos:
    name: Sin credenciales en el árbol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar API keys
        run: |
          if grep -rIn --exclude-dir=.git -E 'sk_live_[A-Za-z0-9]+_[0-9a-f]{64}' .; then
            echo "::error::Se encontró lo que parece una API key real."
            exit 1
          fi
          echo "OK: ninguna API key en el árbol."
      - name: El .env no debe estar versionado
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env está versionado; debe estar ignorado."
            exit 1
          fi
          echo "OK: .env no versionado."

  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    needs: secretos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Sintaxis
        shell: bash
        run: for f in *.mjs; do node --check "$f"; done

      # Todo lo de abajo corre SIN credenciales reales. `resolveConfig` solo
      # valida que haya un token, no que sirva, así que con uno falso se
      # ejercitan el parseo y las guardas sin tocar la red. Eso permite que un
      # PR de un fork tenga CI de verdad sin exponer ningún secreto.
      - name: Casos que deben pasar
        shell: bash
        run: |
          set -e
          node sq-test.mjs --help > /dev/null
          echo "" | node sq-test.mjs > /dev/null || test $? -eq 2   # sin TTY: ayuda + 2

      - name: Casos que deben fallar (y con qué código)
        shell: bash
        env:
          # A propósito NO tiene la forma de una key real: si la tuviera, el
          # job `secretos` de arriba fallaría sobre este mismo archivo.
          # `resolveConfig` solo valida que haya token, no que sirva.
          SQ_TEST_TOKEN: clave-de-prueba-del-ci-no-sirve
        run: |
          esperar() {
            local esperado="$1"; shift
            set +e; "$@" > /dev/null 2>&1; local got=$?; set -e
            if [ "$got" != "$esperado" ]; then
              echo "::error::[$*] salió $got, esperaba $esperado"; exit 1
            fi
            echo "ok  $esperado  $*"
          }
          esperar 2 node sq-test.mjs comando-que-no-existe
          esperar 2 node sq-test.mjs list-kbs --json=quizas
          esperar 2 node sq-test.mjs query-kb --kb x --q -v
          esperar 2 node sq-test.mjs query-kb --kb x --q Y mode precise
          esperar 2 node sq-test.mjs query-kb --kb x --q hola --mdo precise
          esperar 2 node sq-test.mjs verify-claim --kb x --claim y
          esperar 2 node sq-test.mjs verify-claim --kb x --claim y --yes=false
          esperar 2 node sq-test.mjs call verify_claim '{}'
          esperar 2 node sq-test.mjs hasOwnProperty
          esperar 2 node sq-test.mjs call get_user_preferences '{}' sobra

      - name: init crea la config del usuario
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          export USERPROFILE="$HOME"
          mkdir -p "$HOME"
          node sq-test.mjs init
          test -f "$HOME/.config/sq-test/.env" || { echo "::error::init no creó el archivo"; exit 1; }
          grep -q "SQ_TEST_TOKEN=" "$HOME/.config/sq-test/.env"
          echo "OK: init crea la config."

      - name: Se instala como comando global
        shell: bash
        run: |
          npm install -g .
          sq-test --help | head -1

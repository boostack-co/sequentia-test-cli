name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # Se corre ANTES que nada: si se filtró una credencial, no queremos ni
  # compilar, queremos que el PR falle a la vista.
  secretos:
    name: Sin credenciales en el árbol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar API keys
        run: |
          if grep -rIn --exclude-dir=.git -E 'sk_live_[A-Za-z0-9]+_[0-9a-f]{64}' .; then
            echo "::error::Se encontró lo que parece una API key real."
            exit 1
          fi
          echo "OK: ninguna API key en el árbol."
      - name: El .env no debe estar versionado
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env está versionado; debe estar ignorado."
            exit 1
          fi
          echo "OK: .env no versionado."

  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    needs: secretos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Sintaxis
        shell: bash
        run: for f in *.mjs; do node --check "$f"; done

      # Todo lo de abajo corre SIN credenciales reales. `resolveConfig` solo
      # valida que haya un token, no que sirva, así que con uno falso se
      # ejercitan el parseo y las guardas sin tocar la red. Eso permite que un
      # PR de un fork tenga CI de verdad sin exponer ningún secreto.
      - name: Casos que deben pasar
        shell: bash
        run: |
          set -e
          node sq-test.mjs --help > /dev/null
          echo "" | node sq-test.mjs > /dev/null || test $? -eq 2   # sin TTY: ayuda + 2
          # La deducción de `api doctor` es pura, así que se ejercita sin
          # credencial y sin red — incluida la rama que la colección de hoy no
          # alcanza. Un motivo mal asignado no falla, solo miente.
          node doctor-smoke.mjs
          # La coleccion es cara al cliente: si una descripcion miente sobre lo
          # que una peticion escribe o cuesta, el dano es de quien la corre.
          # Corre sin credenciales y sin red, como el resto del CI.
          node collection-lint.mjs

      - name: Casos que deben fallar (y con qué código)
        shell: bash
        env:
          # A propósito NO tiene la forma de una key real: si la tuviera, el
          # job `secretos` de arriba fallaría sobre este mismo archivo.
          # `resolveConfig` solo valida que haya token, no que sirva.
          SQ_TEST_TOKEN: clave-de-prueba-del-ci-no-sirve
        run: |
          esperar() {
            local esperado="$1"; shift
            set +e; "$@" > /dev/null 2>&1; local got=$?; set -e
            if [ "$got" != "$esperado" ]; then
              echo "::error::[$*] salió $got, esperaba $esperado"; exit 1
            fi
            echo "ok  $esperado  $*"
          }
          esperar 2 node sq-test.mjs comando-que-no-existe
          esperar 2 node sq-test.mjs list-kbs --json=quizas
          esperar 2 node sq-test.mjs query-kb --kb x --q -v
          esperar 2 node sq-test.mjs query-kb --kb x --q Y mode precise
          esperar 2 node sq-test.mjs query-kb --kb x --q hola --mdo precise
          esperar 2 node sq-test.mjs verify-claim --kb x --claim y
          esperar 2 node sq-test.mjs verify-claim --kb x --claim y --yes=false
          esperar 2 node sq-test.mjs call verify_claim '{}'
          esperar 2 node sq-test.mjs hasOwnProperty
          esperar 2 node sq-test.mjs call get_user_preferences '{}' sobra

          # Carril API. Ninguno toca la red: fallan en el parseo o en la config.
          esperar 2 node sq-test.mjs api                                  # falta el subcomando
          esperar 2 node sq-test.mjs api nada                             # subcomando inexistente
          esperar 2 node sq-test.mjs api hasOwnProperty                   # y tampoco por el prototipo
          esperar 2 node sq-test.mjs api health sobra                     # posicional de más
          esperar 2 node sq-test.mjs api health --raw                     # en REST no hay sobre que mostrar
          esperar 2 node sq-test.mjs api health --url https://x.invalid   # --url es el endpoint MCP
          esperar 2 node sq-test.mjs api health --json=quizas             # booleano con valor inválido
          esperar 2 node sq-test.mjs api health --api-url no-es-una-url   # URL ilegible = config, no transporte
          esperar 2 node sq-test.mjs api health                           # falta SQ_TEST_API_URL

          # Ejecutor genérico. `api list` lee la colección empaquetada, así que
          # corre sin credencial y sin red: es un caso POSITIVO en esta matriz.
          node sq-test.mjs api list > /dev/null || { echo "::error::api list falló"; exit 1; }
          echo "ok  0  node sq-test.mjs api list"
          esperar 2 node sq-test.mjs api run                                   # falta el nombre
          esperar 2 node sq-test.mjs api run 'no existe'                       # no está en la colección
          esperar 2 node sq-test.mjs api run 'Analytics'                       # ambiguo: no elige por vos
          esperar 2 node sq-test.mjs api run '1. Retrieve' --var kbId=x        # gasta creditos, falta --yes
          esperar 2 node sq-test.mjs api run 'Get knowledge base'              # falta --var kbId
          esperar 2 node sq-test.mjs api run 'Health' --var suelto             # --var mal formado
          esperar 2 node sq-test.mjs api run 'Health' --var baseUrl=http://x   # variable reservada
          esperar 2 node sq-test.mjs api list --raw                            # --raw no existe en REST
          esperar 2 node sq-test.mjs api list sobra                            # posicional de mas

          # Atajos del carril agéntico. La guarda de --yes corre ANTES de
          # resolver la config, así que estos fallan por la guarda y no por
          # "falta SQ_TEST_API_URL" — que es justamente lo que tienen que decir.
          esperar 2 node sq-test.mjs api retrieve --kb X --q Y                  # gasta creditos, falta --yes
          esperar 2 node sq-test.mjs api verify --kb X --claim Y                # idem
          esperar 2 node sq-test.mjs api gap-report --kb X --q Y --yes=false    # el booleano explicito no bypassea
          esperar 2 node sq-test.mjs api feedback --kb X --rating helpful       # persiste, falta --yes
          esperar 2 node sq-test.mjs api query --kb X --q Y --yes               # /query toma un array: es --kbs
          esperar 2 node sq-test.mjs api retrieve --kb X --q Y --mximo 3 --yes  # flag desconocido, no se ignora
          esperar 2 node sq-test.mjs api retrieve --kb X --q Y sobra --yes      # posicional de mas
          # `index-status` no gasta ni escribe, asi que no acepta --yes: una
          # opcion aceptada es una opcion usada.
          esperar 2 node sq-test.mjs api index-status --kb X --yes

          # Los topes. Estos SI necesitan una celda configurada, porque la
          # validacion del cuerpo corre despues de resolver la config; sin
          # --api-url pasarian por "falta SQ_TEST_API_URL" y no probarian el
          # tope. La URL es .invalid y nada sale a la red: el cuerpo se arma
          # antes de construir el cliente.
          celda=(--api-url https://celda.invalid)
          esperar 2 node sq-test.mjs api retrieve --kb X --q Y --max-results 60 --yes "${celda[@]}"   # /retrieve topa en 50
          esperar 2 node sq-test.mjs api query --kbs X --q Y --max-results 30 --yes "${celda[@]}"     # /query topa en 20
          esperar 2 node sq-test.mjs api query --kbs A,A --q Y --yes "${celda[@]}"                    # KBs repetidas
          esperar 2 node sq-test.mjs api query --kbs '' --q Y --yes "${celda[@]}"                     # lista vacia
          esperar 2 node sq-test.mjs api index-status "${celda[@]}"                                   # falta --kb
          esperar 2 node sq-test.mjs api gap-report --kb X --q Y --priority urgente --yes "${celda[@]}"
          esperar 2 node sq-test.mjs api feedback --kb X --rating quizas --yes "${celda[@]}"
          # Sin id recordado, `feedback` se niega: el campo es opcional en el
          # esquema, asi que un vacio escribiria una fila ligada a nada.
          esperar 2 node sq-test.mjs api feedback --kb X --rating helpful --yes "${celda[@]}"
          # `api doctor` no toma opciones: lo que necesita sale de la config.
          # Un flag aceptado y no usado es el fallo silencioso que este CLI
          # rechaza en todas partes.
          esperar 2 node sq-test.mjs api doctor --kb X            # no existe esa opcion
          esperar 2 node sq-test.mjs api doctor --yes             # no escribe: nada que confirmar
          esperar 2 node sq-test.mjs api doctor sobra             # posicional de mas
          esperar 2 node sq-test.mjs api doctor                   # falta SQ_TEST_API_URL
          # `api collection` contrasta con lo publicado. Sin red no se puede
          # contrastar, asi que lo que se ejercita aca es el parseo y la config.
          esperar 2 node sq-test.mjs api collection                            # falta --check o --refresh
          esperar 2 node sq-test.mjs api collection --checkk                   # flag mal escrito
          esperar 2 node sq-test.mjs api collection --check sobra              # posicional de mas
          esperar 2 node sq-test.mjs api collection --check                    # falta SQ_TEST_COLLECTION_URL

      - name: init crea la config del usuario
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          export USERPROFILE="$HOME"
          mkdir -p "$HOME"
          node sq-test.mjs init
          test -f "$HOME/.config/sq-test/.env" || { echo "::error::init no creó el archivo"; exit 1; }
          grep -q "SQ_TEST_TOKEN=" "$HOME/.config/sq-test/.env"
          echo "OK: init crea la config."

      - name: Se instala como comando global
        shell: bash
        run: |
          npm install -g .
          sq-test --help | head -1
